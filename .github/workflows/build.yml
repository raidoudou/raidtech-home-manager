name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Raidtech.HomeManager.sln
      - name: Build
        run: dotnet build Raidtech.HomeManager.sln --configuration Release --no-restore --output ./artifacts/plugin
      - name: Upload plugin build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Raidtech.HomeManager-${{ github.sha }}
          path: |
            artifacts/plugin/Raidtech.HomeManager.dll
          if-no-files-found: error
          retention-days: 14
